<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портал координации технических служб</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --card-bg: #2b2b36;
      --accent: #e0a96d;
      --accent-hover: #c89358;
      --text: #f3f3f3;
      --text-muted: #a0a0a0;
      --success: #4caf50;
      --error: #f44336;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--accent);
      text-align: center;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #18181e;
      border: 1px solid #3f3f4e;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      border: none;
      border-radius: 6px;
      color: #18181e;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    #statusMessage.success {
      display: block;
      background-color: rgba(76, 175, 80, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    #statusMessage.error {
      display: block;
      background-color: rgba(244, 67, 54, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Координация служб</h1>
    <p class="subtitle">Отправка оперативных сводок и заявок</p>

    <form id="serviceForm">
      <div class="form-group">
        <label for="serviceDepartment">Служба / Подразделение</label>
        <select id="serviceDepartment" required>
          <option value="" disabled selected>Выберите службу</option>
          <option value="Звуковой цех">Звуковой цех</option>
          <option value="Осветительский цех">Осветительский цех</option>
          <option value="Машинно-декорационная часть">Машинно-декорационная часть (МДЧ)</option>
          <option value="Костюмерный цех">Костюмерный цех</option>
          <option value="Гримёрный цех">Гримёрный цех</option>
          <option value="Реквизиторский цех">Реквизиторский цех</option>
          <option value="Видео / Мультимедиа">Видео / Мультимедиа</option>
          <option value="Администрация">Администрация / Дежурный</option>
        </select>
      </div>

      <div class="form-group">
        <label for="responsiblePerson">Ответственное лицо (ФИО)</label>
        <input type="text" id="responsiblePerson" placeholder="Например: Иванов И.И." required>
      </div>

      <div class="form-group">
        <label for="taskType">Тип обращения</label>
        <select id="taskType" required>
          <option value="Готовность к спектаклю/репетиции">Готовность к спектаклю/репетиции</option>
          <option value="Техническая неисправность">Техническая неисправность / Ремонт</option>
          <option value="Запрос оборудования/реквизита">Запрос оборудования / реквизита</option>
          <option value="Оперативное сообщение">Оперативное сообщение</option>
        </select>
      </div>

      <div class="form-group">
        <label for="messageDetails">Суть задачи / Комментарий</label>
        <textarea id="messageDetails" placeholder="Опишите статус, неисправность или запрос..." required></textarea>
      </div>

      <button type="submit" id="submitBtn">Отправить данные</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script>
    // URL твоего Google Apps Script веб-приложения:
    const SCRIPT_URL = "ТВОЙ_URL_ВЕБ_ПРИЛОЖЕНИЯ";

    const form = document.getElementById("serviceForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Отправка...";
      statusMessage.className = "";
      statusMessage.style.display = "none";

      const payload = {
        department: document.getElementById("serviceDepartment").value,
        person: document.getElementById("responsiblePerson").value,
        type: document.getElementById("taskType").value,
        details: document.getElementById("messageDetails").value,
        timestamp: new Date().toLocaleString("ru-RU")
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMessage.textContent = "Данные успешно переданы в таблицу!";
        statusMessage.className = "success";
        form.reset();
      })
      .catch((error) => {
        console.error("Ошибка:", error);
        statusMessage.textContent = "Ошибка при отправке. Проверьте соединение.";
        statusMessage.className = "error";
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Отправить данные";
      });
    });
  </script>
</body>
</html>
